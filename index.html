<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>柜门配色效果预览</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23161616'/><circle cx='32' cy='32' r='15' fill='%23EBB25C'/></svg>">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: #f2f0ed; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  color: #1c1c1c; line-height: 1.5; padding-bottom: 28px;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 0 14px; }

.header { padding: 22px 4px 14px; }
.header h1 { font-size: 22px; font-weight: 800; letter-spacing: .5px; }
.header p { margin-top: 6px; font-size: 13.5px; color: #6b6762; }

.card {
  background: #fff; border-radius: 18px; padding: 14px;
  box-shadow: 0 6px 22px rgba(28, 24, 20, .07);
  margin-top: 14px;
}
.stage { border-radius: 12px; overflow: hidden; background: #e9e7e4; }
.stage canvas { width: 100%; display: block; }

.current {
  display: flex; align-items: center; gap: 10px;
  margin-top: 12px; padding: 10px 12px;
  background: #f6f5f3; border-radius: 12px;
}
.current .dot {
  width: 30px; height: 30px; border-radius: 8px; flex: 0 0 auto;
  border: 1px solid rgba(0,0,0,.12); background: #EBB25C;
}
.current .lab { font-size: 12.5px; color: #8a857f; }
.current .name { font-size: 16px; font-weight: 700; }
.current .hex { font-size: 12px; color: #9a958f; margin-left: auto; font-variant-numeric: tabular-nums; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; border: 1px solid #ddd8d2; background: #fff;
  font-size: 13.5px; color: #55504b; padding: 7px 16px;
  border-radius: 999px; cursor: pointer; transition: all .2s;
}
.chip.on { background: #1a1a1a; border-color: #1a1a1a; color: #fff; font-weight: 600; }

.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (min-width: 600px) { .grid { grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .card { padding: 18px; } }
.swatch { cursor: pointer; text-align: center; min-width: 0; }
.swatch .chipbox {
  position: relative; width: 100%; aspect-ratio: 1; border-radius: 12px;
  border: 1px solid rgba(0,0,0,.14);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
  transition: transform .18s, box-shadow .18s;
}
.swatch .chipbox::after {
  content: ""; position: absolute; right: 5px; top: 5px;
  width: 16px; height: 16px; border-radius: 50%;
  background: #1a1a1a url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='5 12.5 10 17.5 19 7.5'/></svg>") center/11px no-repeat;
  opacity: 0; transform: scale(.5); transition: all .18s;
}
.swatch.on .chipbox { box-shadow: 0 0 0 2px #1a1a1a, 0 0 0 4px #fff; }
.swatch.on .chipbox::after { opacity: 1; transform: scale(1); }
.swatch:active .chipbox { transform: scale(.93); }
.swatch .nm {
  display: block; margin-top: 6px; font-size: 12.5px; color: #4a4642;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.swatch.on .nm { color: #111; font-weight: 700; }

.footer-note {
  margin-top: 16px; padding: 13px 15px;
  background: #1c1c1c; color: #e8e4de; border-radius: 14px; font-size: 13.5px;
}
.footer-note b { color: #f0b95e; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>柜门配色效果预览</h1>
    <p>柜体为黑色砂纹哑光，三个门的圆孔为镂空，点击下方颜色即可查看圆孔内贴板效果。</p>
  </div>

  <div class="card">
    <div class="stage"><canvas id="cv" width="916" height="509"></canvas></div>
    <div class="current">
      <div class="dot" id="curDot"></div>
      <div>
        <div class="lab">当前选择</div>
        <div class="name" id="curName">橙黄</div>
      </div>
      <div class="hex" id="curHex">#EBB25C</div>
    </div>
  </div>

  <div class="card">
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="footer-note">
    选定颜色后，把<b>颜色名称</b>发给我们，即可采购对应颜色的材料进行贴板。
  </div>
</div>

function findColor(n) {
  for (var i = 0; i < COLORS.length; i++) if (COLORS[i].n === n) return COLORS[i];
}

// 灰度 mask 无 alpha 通道（浏览器解码后 alpha 全为 255），
// 这里把灰度值转成 alpha，生成可用于 destination-in 的遮罩，仅构建一次。
var maskCanvas = null;
function buildAlphaMask() {
  var c = document.createElement("canvas");
  c.width = W; c.height = H;
  var x = c.getContext("2d");
  x.drawImage(imMask, 0, 0, W, H);
  var img = x.getImageData(0, 0, W, H);
  var d = img.data;
  for (var i = 0; i < d.length; i += 4) {
    var g = d[i]; // 灰度图 R=G=B，取其亮度作为不透明度
    d[i] = 255; d[i + 1] = 255; d[i + 2] = 255; d[i + 3] = g;
  }
  x.putImageData(img, 0, 0);
  maskCanvas = c;
}

function draw(hex) {
  ctx.clearRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
  ctx.drawImage(imCab, 0, 0, W, H);

  // 颜色层：纯色用孔位 mask 裁剪
  var oc = document.createElement("canvas");
  oc.width = W; oc.height = H;
  var octx = oc.getContext("2d");
  octx.fillStyle = hex;
  octx.fillRect(0, 0, W, H);
  octx.globalCompositeOperation = "destination-in";
  octx.drawImage(maskCanvas, 0, 0, W, H);
  ctx.drawImage(oc, 0, 0);

  // 毛毡纹理层：纹理平铺后用 mask 裁剪，overlay 混合
  var tc = document.createElement("canvas");
  tc.width = W; tc.height = H;
  var tctx = tc.getContext("2d");
  tctx.save();
  var TS = 170;
  var mini = document.createElement("canvas");
  mini.width = TS; mini.height = TS;
  mini.getContext("2d").drawImage(imTex, 0, 0, TS, TS);
  var pat = tctx.createPattern(mini, "repeat");
  tctx.fillStyle = pat;
  tctx.fillRect(0, 0, W, H);
  tctx.globalCompositeOperation = "destination-in";
  tctx.drawImage(maskCanvas, 0, 0, W, H);
  tctx.restore();
  ctx.globalCompositeOperation = "overlay";
  ctx.globalAlpha = 0.5;
  ctx.drawImage(tc, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
}

function renderChips() {
  var names = ["全部"].concat(GROUPS);
  var html = "";
  names.forEach(function (nm) {
    html += '<div class="chip' + (filter === nm ? ' on' : '') + '" data-f="' + nm + '">' + nm + '</div>';
  });
  document.getElementById("chips").innerHTML = html;
  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (el) {
    el.addEventListener("click", function () {
      filter = el.getAttribute("data-f");
      renderChips(); renderGrid();
    });
  });
}

function renderGrid() {
  var list = filter === "全部" ? COLORS : COLORS.filter(function (c) { return c.g === filter; });
  var html = "";
  list.forEach(function (c) {
    html += '<div class="swatch' + (current === c.n ? ' on' : '') + '" data-n="' + c.n + '">'
      + '<div class="chipbox" style="background:' + c.h + '"></div>'
      + '<span class="nm">' + c.n + '</span></div>';
  });
  document.getElementById("grid").innerHTML = html;
  Array.prototype.forEach.call(document.querySelectorAll(".swatch"), function (el) {
    el.addEventListener("click", function () { select(el.getAttribute("data-n")); });
  });
}

function select(n) {
  current = n;
  var c = findColor(n);
  draw(c.h);
  document.getElementById("curDot").style.background = c.h;
  document.getElementById("curName").textContent = c.n;
  document.getElementById("curHex").textContent = c.h;
  renderGrid();
}

Promise.all([imCab, imMask, imTex]).then(function (ims) {
  imCab = ims[0]; imMask = ims[1]; imTex = ims[2];
  buildAlphaMask();
  renderChips();
  renderGrid();
  draw("#EBB25C");
});
</script>
</body>
</html>
